name: Test (manual)

# CI 的定位是「编译打包」，由 build.yml 负责；全量测试不随 push/PR 自动跑。
# 原因：mvn -B test 含重型 BallTournamentServiceTest，在 CI 上长期卡死/失败（自 2026-10-04），
# 反复发失败通知却与本次构建无关。测试改由本地定向单测 + 手动触发承担，需要时在 Actions 页手动 Run。
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sports-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B test
