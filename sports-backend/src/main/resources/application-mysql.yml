# ============================================================================
# MySQL 生产环境配置
# ============================================================================
# 使用方式：java -jar sports-1.0.0.jar --spring.profiles.active=mysql
# 或设置环境变量：MYSQL_URL, MYSQL_USER, MYSQL_PASS
# ============================================================================

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/sports_meet?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASS:root}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 30
        order_inserts: true
