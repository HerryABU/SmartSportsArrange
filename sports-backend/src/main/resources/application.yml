# ============================================================================
# 运动会智能编排系统 — 配置文件
# ============================================================================
# 三库支持，默认 SQLite（零配置）：
#   java -jar sports-1.0.0.jar                          → SQLite（默认）
#   java -jar sports-1.0.0.jar --spring.profiles.active=h2     → H2 文件模式
#   java -jar sports-1.0.0.jar --spring.profiles.active=mysql  → MySQL 生产
# ============================================================================

spring:
  application:
    name: sports-meet

  # 终端 ANSI 颜色：默认 detect（连到真实终端才上色；重定向到文件/管道时自动关闭，
  # 纯文本日志无色属预期）。显式写出以防被意外改成 never；若要强制上色可改 always。
  output:
    ansi:
      enabled: detect

  # ======================== SQLite 数据库（默认）==========================
  # URL 末追加 ?foreign_keys=ON：SQLite 默认不强制外键，显式开启以保证「一旦存在 FK 约束
  # 就被强制」。注意：Hibernate 的 SQLite 方言以 ALTER TABLE ADD CONSTRAINT 建 FK，而
  # SQLite 不支持该语法 → 本库不会自动生成物理 FK（H2 / MySQL 会自动生成）。
  # 该参数只作用于 SQLite URL，H2 / MySQL 各有独立 URL，不受影响。
  datasource:
    url: jdbc:sqlite:./sports_meet.db?foreign_keys=ON
    driver-class-name: org.sqlite.JDBC
    username:
    password:

  # ======================== JPA / Hibernate ===========================
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.community.dialect.SQLiteDialect
        jdbc:
          batch_size: 25
        order_inserts: true

  # ======================== Jackson ===================================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  # ======================== 文件上传 ===================================
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # ======================== 缓存 ======================================
  cache:
    type: simple

# ======================== 服务器 =========================================
server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# ======================== JWT 认证 =======================================
jwt:
  secret: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3ODkwYWJjZGVmZ2hpamtsbW5vcA==
  expiration: 86400000
  refresh-expiration: 604800000

# ======================== 运动会系统配置 ===================================
sports:
  # 文件存储路径（相对于 JAR 运行目录）
  upload-path: ./data/uploads
  export-path: ./data/exports
  log-path: ./data/logs
  backup-path: ./data/backup

  # 默认规则
  default:
    lanes: 8
    max-per-class: 3
    max-per-athlete: 3
    sprint-threshold: 400
    score-decimals: 2

  # 编排算法
  arrange:
    max-attempts: 1000
    timeout-seconds: 30
    local-optimize-rounds: 3

  # 积分规则
  scoring:
    same-rank: true
    record-bonus: false
    record-bonus-points: 10
    participation-points: false
    participation-points-value: 1
    relay-multiplier: 2.0
    team-score-by: class
    team-sort-by: total_score

  # 运动会信息
  meet:
    name: 第X届田径运动会
    location: 学校田径场

  # 赛程自动编排（约束求解，Timefold Solver）
  schedule:
    # 约束求解时间预算（秒）。算法组合层会把它切成多份，让每个候选算法（模拟退火/禁忌搜索/
    # 迟接受…）各跑一遍、取评分最优者；求解失败或超时会回退到贪心编排，接口始终能出方案。
    solver-seconds: 4
    # AI 编排核心（ONNX 推理）。训练侧代码与模型位于根目录 sports-ai/（不在 sports-backend），
    # 运行时由 onnxruntime 从 model-dir 加载 .onnx；模型缺失/加载失败/推理异常时自动回退规则编排。
    ai:
      # 总开关：false 时完全禁用 AI 编排（回退纯规则）
      enabled: true
      # 模型目录（相对 JAR 运行目录）：指向 sports-ai/models 导出的 .onnx（可复制或软链到此）
      model-dir: ../sports-ai/models
      # 算法选择器：16 维实例特征 → 硬解/取消路径
      selector-model: algorithm_selector.onnx
      # 冲突簇 GNN：冲突图 → 节点着色优先级
      gnn-model: conflict_gnn.onnx
      # GAN 生成器：冲突图 + 噪声 → 时间槽着色方案（直接学习着色）
      scheme-generator-model: scheme_generator.onnx
    # 大邻域搜索（LNS）精修轮数：0 = 关闭。每轮「破坏一块（年级/时段窗口/最忙运动员）
    # → 只重建这一块 → 只接受更好的」，轮数越多越可能跳出现有局部最优（代价是接口更慢）。
    lns-rounds: 2
    # LNS 每轮时间预算（毫秒）
    lns-round-millis: 700
    # 遗传算法（GA）种群大小：< 2 = 关闭。GA 让好解之间繁殖（交叉重组好的落位模式、
    # 变异扰动坏的），比「多起点波次各跑各的」探索得更全局。
    ga-population: 6
    # GA 代数
    ga-generations: 2
    # GA 变异概率（0..1）
    ga-mutation-rate: 0.15
    # GA 初始种群里每个「多样化个体」的求解时间预算（毫秒）
    ga-individual-millis: 300
    # 多邻域模拟退火（MNSA）步数：0 = 关闭。六种邻域移动 + UCB1 自适应 + SA 接受准则，
    # 每步只是快速评分（不跑求解器），步数越多探索越充分（2026-09-27 由 60 提至 120）。
    mnsa-iterations: 120
    # 自适应大邻域搜索（ALNS）破坏-修复轮数：0 = 关闭。四种破坏 × 两种修复由 UCB1 老虎机
    # 按收益选择，冲突簇破坏直接利用兼项冲突图结构（2026-09-27 由 4 提至 8）。
    alns-rounds: 8
    # Fix-and-Optimize 最大重排轮数：0 = 关闭。每轮放开至多 10 个兼项冲突切片做精确重排
    # （其余冻结），切片预算逐轮翻倍（封顶 ×4），切片全部消除或整轮无接受即停。
    fixopt-rounds: 2
    # Fix-and-Optimize 第一轮每个切片的重排时间预算（毫秒）
    fixopt-slice-millis: 600
    # 对抗式自检最大重排轮数：编排完成后若独立校验发现硬约束违反，则换随机种子重排，
    # 最多尝试此次数；0 表示不做对抗重排（直接返回首轮结果）。前端编排表单可逐次覆盖。
    adversarial-max-rounds: 5

# ======================== 日志 ===========================================
logging:
  # 关闭 logback 自带的 JVM 关闭钩子：否则 Ctrl+C / kill 时，logback 的钩子可能先于
  # Spring 的关闭钩子执行、把 logback 停掉；随后 Spring 关闭上下文时若需打印携带异常的
  # 警告，就会抛 NoClassDefFoundError: ch/qos/logback/classic/spi/ThrowableProxy。
  # 置 false 可让 logback 存活到 Spring 关闭钩子结束，退出干净（见 spring-boot#4968）。
  register-shutdown-hook: false
  level:
    com.sports: DEBUG
    org.springframework.security: INFO
  charset:
    console: ${file.encoding}
    file: ${file.encoding}
  file:
    path: ./data/logs
    name: ./data/logs/sports.log

# ======================== Actuator =======================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ======================== SpringDoc / Swagger =============================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
