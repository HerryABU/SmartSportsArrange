# ============================================================================
# H2 文件数据库配置（非内存模式）
# ============================================================================
# 使用方式：java -jar sports-1.0.0.jar --spring.profiles.active=h2
# ============================================================================

spring:
  datasource:
    url: jdbc:h2:file:./data/sports_meet;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          batch_size: 20
        order_inserts: true
